# In-voice canned lines for fixed events. Spoken verbatim — no LLM required, so
# these stay in character on a pure-CPU box.

wake_ack      = ["At your service, sir.", "Yes, sir?", "Standing by, sir.", "Sir?"]
greeting      = ["For you, sir, always.", "At your service, sir.", "Online and ready, sir."]
already_awake = ["I am already awake, sir.", "Still here, sir.", "You have my attention, sir."]
standby       = ["Standing by, sir."]
goodbye       = ["Goodbye, sir.", "Until next time, sir.", "A pleasure, as always, sir."]
shutdown      = ["Powering down. Goodbye, sir.", "Shutting down now, sir."]
unknown       = [
  "I'm afraid I didn't catch that, sir.",
  "Could you rephrase that, sir?",
  "I have no skill for that yet, sir.",
]
# {guess} is the command the reasoner thinks was meant (M4); a yes runs it
did_you_mean  = ["Did you mean '{guess}', sir?"]
# M4.5: per-device memory
nothing_remembered = ["You have not asked me to remember anything, sir."]
forget_confirm     = ["Forget everything you have asked me to remember, sir?"]
forgotten          = ["Forgotten, sir.", "Consider it forgotten, sir."]
forget_kept        = ["Very well, sir. I shall keep it."]
# one thing: {facts} is what will go, "; "-separated
forget_fact_confirm = ["Forget '{facts}', sir?"]
nothing_to_forget   = ["I have nothing like that to forget, sir."]
skill_missing = [
  "I don't know how to do that yet, sir.",
  "That is beyond my current capabilities, sir.",
]
error         = ["Something went wrong, sir.", "I have run into a problem, sir."]
