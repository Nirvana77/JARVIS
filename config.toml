# JARVIS non-secret configuration. Secrets (ANTHROPIC_API_KEY,
# ANTHROPIC_WORKSPACE_ID) stay in .env. See PRD/jarvis-2026-rebuild.md.

[general]
language = "en"           # also overridable with the `language` env var

[persona]
active = "jarvis"         # overridden by the JARVIS_PERSONA env var

[wake]
model = "hey_jarvis"      # openwakeword pretrained model name (bundled, offline)
threshold = 0.5           # score above which the wake word is considered heard

[capture]
sample_rate = 16000
frame_ms = 80             # length of one audio frame fed to the wake detector
window_timeout_s = 8.0    # max length of the listening window opened by the wake word
silence_s = 1.0           # trailing silence that ends an utterance
follow_up_s = 10.0        # after a command, keep listening this long for a follow-up
                          # (no wake word needed) before announcing standby
# --- EXTRA: voice barge-in (off by default, shelved — needs per-mic tuning) ---
# When on: speak a new sentence while a command is being transcribed and that
# transcription is dropped and the new sentence handled instead (no wake word).
# Tune with `./jarvis-run mic` then set barge_in_threshold; see PRD notes.
barge_in = false
barge_in_min_speech_s = 0.6  # sustained speech needed to fire (noise filter)
barge_in_threshold = 0.0     # absolute RMS threshold; 0 = auto-calibrate

allow_interrupt = true    # press Enter in the terminal to cancel the current
                          # listen / transcription (TTY only) — this one is cheap
                          # and reliable, so it stays on

# If commands get cut short / transcribed as nonsense near the end: the VAD's
# auto-calibrated noise floor can be thrown off if you start talking
# immediately after the wake word (with no pause, it calibrates against your
# own loud opening words instead of silence). Run `./jarvis-run mic`, speak
# normally, and if the meter shows the level dropping under the │ marker
# while you're still talking, pin a lower absolute threshold here instead of
# auto-calibrating (pick a value comfortably below your quietest speech but
# above the ambient noise floor shown by the meter).
vad_threshold = 0.0       # absolute RMS threshold; 0 = auto-calibrate

# Which microphone to record from. Empty = the system default input.
# pipewire_node: a PipeWire source name from `pactl list short sources` (wins
# over device). device: a PortAudio index/name from `python -m sounddevice`.
pipewire_node = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"  # built-in laptop mic
device = ""

[stt]
model = "small.en"       # faster-whisper: tiny(.en)/base(.en)/small(.en)/medium(.en).
                         # ".en" models are more accurate for English at the same
                         # size. Bigger = better + slower: medium.en (~1.5GB) is
                         # the next step up; base.en is faster but mis-hears more.
compute_type = "int8"    # "int8_float32" is more accurate, ~1.5x slower on CPU
device = "cpu"           # "cuda" + compute_type "float16" if you have a GPU
language = "en"

[tts]
voice = "en_GB-alan-medium"   # Piper voice; files resolved under <data>/models/piper/
# Speaker to play through: a PipeWire sink name from `pactl list short sinks`;
# empty = the system default output.
pipewire_node = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"  # laptop speakers

[nlu]
embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
threshold = 0.35            # max class probability below this -> "unknown"
similarity_floor = 0.30     # min cosine similarity to any training phrase, else "unknown"
meta_action_threshold = 0.6 # teach/edit_skill/revert_skill need this confidence before
                            # JARVIS commits to the dialog instead of saying "unknown" —
                            # higher than `threshold` because a wrong guess here costs a
                            # whole multi-turn conversation, not just a wrong one-line reply

[reasoner]
enabled = true           # still capability-probed; false disables Ollama entirely
base_url = "http://localhost:11434"
model = "qwen2.5:3b"

[factory]
model = "claude-opus-5"    # overridden by the ANTHROPIC_MODEL env var
sandbox_timeout_s = 10.0    # wall-clock limit for a sandboxed test/dry-run
sandbox_mem_mb = 512        # RLIMIT_AS for a sandboxed subprocess — pytest's
                            # plugin-rewrite discovery alone needs >256MB in a venv
                            # this size (scans every installed dist-info)
sandbox_cpu_s = 5           # RLIMIT_CPU for a sandboxed subprocess

[paths]
data_dir = "data"        # models, nlu artifacts, per-skill scratch (git-ignored)

# --- M3: the remote-edge split (opt-in; `python -m jarvis` stays all-in-one) ---
# The brain runs on a box with a GPU (`python -m jarvis serve`); the edge runs on
# a Pi in the room and owns the mic and speaker (`python -m jarvis edge`). The
# link may cross the internet. See PRD/milestone-3-remote-edge.md.

[server]                 # the brain's listener
host = "127.0.0.1"          # loopback: no TLS needed. Set to 0.0.0.0 + TLS for a real edge.
port = 8765
# TLS is required on a non-loopback bind: either set these, or listen on
# 127.0.0.1 behind a TLS-terminating reverse proxy (Caddy).
tls_cert = ""
tls_key  = ""
allow_insecure = false   # LAN/dev only — plain ws:// on a routable address
# Behind a Cloudflare Tunnel or a reverse proxy on THIS machine, every
# connection arrives from 127.0.0.1, and the auth backoff keyed on that can't
# tell your edge from someone hammering your public hostname. Naming the
# proxy's header fixes that. Believed only when the connection came from
# loopback — from anywhere else it's the client's claim about itself.
#   Cloudflare Tunnel : "CF-Connecting-IP"
#   Caddy/nginx/Traefik: "X-Forwarded-For"
trusted_proxy_header = ""
# ...and, when the proxy is NOT on this machine's loopback — cloudflared in
# Docker (it arrives via the bridge gateway, e.g. 172.17.0.1), or a proxy on
# another host — the addresses whose header is believed. Anything in here can
# claim to be any client, so keep it as narrow as you can. A mistyped entry
# stops the brain at startup rather than silently trusting nothing.
trusted_proxy_peers = []

[whisper]                # the brain's client for the warm jarvis-whisper service
url = "http://127.0.0.1:3461"   # "off" -> no transcription ("Cannot hear you: ...")
timeout_s = 20
# The brain starts this service itself unless something already answers on
# `url` — `python -m jarvis serve` is one command, not three terminals. It
# still runs as its own process (a wedged model is one process to kill), one
# already running under systemd is adopted rather than started twice, and one
# that dies is restarted while the brain runs.
autostart = true
# Which interpreter to start it with. "" = the brain's own, which already has
# faster-whisper; point it at a separate venv when that venv carries something
# the brain should not, such as the CUDA wheels.
python = ""

[voder]                  # the brain's client for jarvis-voder (Piper, CPU)
url = "http://127.0.0.1:3462"   # "off" -> the answer is sent as text only
sample_rate = 16000
autostart = true         # as [whisper] above
python = ""              # "" = the brain's own interpreter

[addressing]             # there is no wake word on the remote path
default_mode = "byname"  # byname | always | pushtotalk | ignore
names = ["jarvis", "hey jarvis"]
# The segmenter closes after 700 ms of silence, which is right for "has the
# person stopped talking" and wrong for "has the person finished the thought":
# fragments are held this long and merged into one utterance. 0 disables it.
#
# Paid on EVERY turn, so it is the biggest single thing between you finishing a
# sentence and hearing an answer. It can be this short because the edge's
# `speaking` message pauses the countdown: the window only has to notice a
# continuation starting, not swallow one whole. The pause it actually tolerates
# is hangover + transcription + hold (~2 s on a GPU brain, ~2.7 s on CPU).
hold_ms = 1000

[edge]                   # `python -m jarvis edge` — the audio satellite
server_url = "ws://127.0.0.1:8765"   # same box; wss://host:8765 for a real Pi
device_id = "livingroom"        # also the name of its state file under data/remote/
tls_ca = ""                     # a CA bundle, for a self-signed brain certificate
reconnect_max_s = 30
ptt_gpio = 0                    # push-to-talk button GPIO pin; 0 = no button
# Mic and speaker, same knobs as [capture] / [tts] above.
input_pipewire_node = "alsa_input.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Mic1__source"   # built-in laptop mic
output_pipewire_node = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"  # laptop speakers
input_device = ""
output_device = ""

# [edge.segment] overrides the segmenter's measured defaults (jarvis/audio/
# segment.py). Only touch these with a recording to test against: every value
# there has a comment saying what it cost to learn.
# [edge.segment]
# hangover_ms = 700
# margin_db = 9
